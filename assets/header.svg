<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-label="Alim Kacar - AI / Machine Learning Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1021"/>
      <stop offset="0.5" stop-color="#0E1633"/>
      <stop offset="1" stop-color="#0A0F1F"/>
    </linearGradient>

    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="220" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.4" stop-color="#A5B4FC"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="220 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="scrim" cx="0.28" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#0B1021" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0B1021" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="typeClip">
      <rect x="150" y="152" width="0" height="26">
        <animate attributeName="width" from="0" to="300" dur="2s" begin="0.7s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="1" y="1" width="878" height="228" rx="18" fill="url(#bgGrad)" stroke="#1E2A4A" stroke-width="1.5"/>

  <!-- ambient scan sweep -->
  <rect x="0" y="1" width="150" height="228" fill="url(#sweep)" opacity="0.05">
    <animate attributeName="x" from="-150" to="880" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- top hairline with moving light -->
  <line x1="24" y1="20" x2="856" y2="20" stroke="#1B2748" stroke-width="1"/>
  <line x1="24" y1="20" x2="120" y2="20" stroke="url(#lineGrad)" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="x1" values="24;760;24" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="120;856;120" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- ================= latent-space neural field (right) ================= -->
  <g stroke="#2A3358" stroke-width="1" fill="none">
    <line x1="560" y1="55" x2="620" y2="90" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="620" y1="90" x2="585" y2="140" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="3s" repeatCount="indefinite"/></line>
    <line x1="620" y1="90" x2="660" y2="46" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.8s" repeatCount="indefinite"/></line>
    <line x1="660" y1="46" x2="700" y2="105" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="3.4s" repeatCount="indefinite"/></line>
    <line x1="700" y1="105" x2="655" y2="160" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="700" y1="105" x2="742" y2="70" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="3.1s" repeatCount="indefinite"/></line>
    <line x1="742" y1="70" x2="782" y2="130" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.9s" repeatCount="indefinite"/></line>
    <line x1="782" y1="130" x2="820" y2="165" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="3.3s" repeatCount="indefinite"/></line>
    <line x1="742" y1="70" x2="820" y2="92" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.7s" repeatCount="indefinite"/></line>
    <line x1="782" y1="130" x2="655" y2="160" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="3.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- nodes (twinkle) -->
  <g fill="#22D3EE">
    <circle cx="560" cy="55" r="2.4"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="585" cy="140" r="2.2"><animate attributeName="opacity" values="0.8;0.25;0.8" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="105" r="3" fill="#818CF8"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/><animate attributeName="r" values="2.6;3.4;2.6" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="742" cy="70" r="2.4"><animate attributeName="opacity" values="0.9;0.35;0.9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="782" cy="130" r="2.6" fill="#818CF8"><animate attributeName="opacity" values="0.35;0.85;0.35" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="165" r="2.2"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="92" r="2.2"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="46" r="2.2"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="655" cy="160" r="2.2"><animate attributeName="opacity" values="0.45;0.9;0.45" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="90" r="2.6" fill="#818CF8"><animate attributeName="opacity" values="0.9;0.4;0.9" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- traveling data pulses -->
  <circle r="3.4" fill="#FBBF24">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    <animateMotion dur="4.5s" repeatCount="indefinite" calcMode="linear" path="M620,90 L660,46 L700,105 L742,70 L700,105 L660,46 L620,90"/>
  </circle>
  <circle r="3" fill="#FBBF24">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
    <animateMotion dur="5.2s" repeatCount="indefinite" calcMode="linear" path="M742,70 L782,130 L820,165 L782,130 L742,70"/>
  </circle>

  <!-- faint accent twinkles left -->
  <g fill="#818CF8">
    <circle cx="470" cy="46" r="1.8"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="505" cy="150" r="1.6"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="40" r="1.6"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- legibility scrim behind headline -->
  <rect x="0" y="40" width="520" height="160" fill="url(#scrim)"/>

  <!-- ================= identity ================= -->
  <text x="44" y="102" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="46" font-weight="700" fill="url(#nameGrad)" letter-spacing="1">Alim Kaçar</text>

  <!-- draw-on underline -->
  <line x1="46" y1="116" x2="322" y2="116" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="280" stroke-dashoffset="280">
    <animate attributeName="stroke-dashoffset" from="280" to="0" dur="1.1s" begin="0.3s" fill="freeze"/>
  </line>

  <text x="48" y="140" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17" font-weight="500" fill="#9AA7C7" letter-spacing="2">AI / MACHINE LEARNING ENGINEER</text>

  <!-- terminal line -->
  <text x="46" y="171" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#5EEAD4">alim@ml</text>
  <text x="112" y="171" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#4B5878">:~$</text>
  <g clip-path="url(#typeClip)">
    <text x="152" y="171" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#C9D3EC">building AI systems that ship</text>
  </g>
  <rect x="150" y="160" width="8" height="15" fill="#FBBF24">
    <animate attributeName="x" from="150" to="420" dur="2s" begin="0.7s" fill="freeze" calcMode="linear"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- small corner tag -->
  <text x="836" y="210" text-anchor="end" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11.5" fill="#3E4A6E" letter-spacing="1">&lt;/&gt; Python-first · T-shaped</text>
</svg>
