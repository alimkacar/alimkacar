<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="880" height="130" role="img" aria-label="Let us build something intelligent">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#0B1021"/>
    </linearGradient>
    <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="878" height="128" rx="18" fill="url(#fbg)" stroke="#1E2A4A" stroke-width="1.5"/>

  <!-- moving light rule -->
  <line x1="24" y1="26" x2="856" y2="26" stroke="#18233F" stroke-width="1"/>
  <line x1="24" y1="26" x2="150" y2="26" stroke="url(#fline)" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="x1" values="24;700;24" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="150;856;150" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- rail with traveling pulse -->
  <line x1="70" y1="98" x2="810" y2="98" stroke="#202C4C" stroke-width="1.5" stroke-dasharray="3 7">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3s" repeatCount="indefinite"/>
  </line>
  <circle r="3.5" cy="98" fill="#FBBF24">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear" path="M70,0 L810,0 L70,0"/>
  </circle>

  <!-- terminal sign-off -->
  <text x="70" y="72" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="18" fill="#5EEAD4">alim@ml</text>
  <text x="152" y="72" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="18" fill="#4B5878">:~$</text>
  <text x="200" y="72" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="18" fill="#C9D3EC">echo "let's build something intelligent"</text>
  <rect x="612" y="59" width="9" height="17" fill="#FBBF24">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
